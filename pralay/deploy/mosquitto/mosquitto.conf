# Mosquitto MQTT Broker Configuration for Pralay

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Allow anonymous connections (disable in production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Connection settings
max_connections -1
max_queued_messages 1000

# Message size limits
message_size_limit 0

# Security (enable in production)
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
